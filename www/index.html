<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Edge Journal</title><style>
:root{--c:rgba(255,255,255,.07);--b:rgba(255,255,255,.13);--p:#8b5cf6;--m:#a79ec9}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(165deg,#34197a,#120a2a 55%) fixed;color:#f3f0ff;font:15px system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 14px) 14px 100px}
h1{font-size:28px;font-weight:300;margin:8px 0 14px}h2{font-size:15px;font-weight:600;margin:16px 0 8px}
.card{background:var(--c);border:1px solid var(--b);border-radius:20px;padding:14px;margin-bottom:10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:26px;font-weight:600}.sm{font-size:12px;color:var(--m)}
.chip{display:inline-block;padding:7px 13px;border-radius:99px;border:1px solid var(--b);background:var(--c);margin:0 6px 6px 0;color:#f3f0ff;font-size:13px}
.chip.on{background:var(--p);border-color:var(--p)}
input,textarea,select{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--b);border-radius:12px;padding:11px;color:#fff;font:inherit;margin-bottom:8px}
textarea{min-height:64px}label{font-size:12px;color:var(--m);display:block;margin:4px 0 3px}
button{font:inherit}.btn{background:var(--p);border:0;color:#fff;padding:13px;border-radius:14px;width:100%;margin-top:6px}.btn.o{background:var(--c);border:1px solid var(--b)}
nav{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);background:rgba(30,16,70,.85);backdrop-filter:blur(14px);border:1px solid var(--b);border-radius:26px;display:flex;justify-content:space-around;align-items:center;padding:8px}
nav button{background:none;border:0;color:var(--m);padding:8px 10px;font-size:12px}nav button.on{color:#fff}
nav .plus{background:var(--p);color:#fff;width:50px;height:50px;border-radius:50%;font-size:28px;padding:0}
.ov{position:fixed;inset:0;background:#160c33;z-index:9;overflow:auto;padding:calc(env(safe-area-inset-top) + 14px) 14px 40px}
.row{display:flex;justify-content:space-between;align-items:center}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.cal div{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--c)}
.imgs img{width:calc(50% - 4px);border-radius:12px;margin:2px}
</style></head><body><div id="app"></div><script>
const RS={win:['Win','#34d399'],loss:['Loss','#f87171'],be:['Breakeven','#9ca3af'],al:['Avoided loss','#fb923c'],aw:['Avoided win','#60a5fa']};
const REAL=['win','loss','be'];let T=[],tab='home',M=new Date(),F='all',FD=null,db;
const A=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const q=(m,f)=>new Promise(r=>{const o=f(db.transaction('t',m).objectStore('t'));o.onsuccess=()=>r(o.result)});
const load=async()=>{T=(await q('readonly',s=>s.getAll())).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time))};
const ym=()=>M.getFullYear()+'-'+String(M.getMonth()+1).padStart(2,'0');
const mt=()=>T.filter(t=>t.date.startsWith(ym()));
function S(l){const re=l.filter(t=>REAL.includes(t.r)),w=re.filter(t=>t.r=='win'),x=re.filter(t=>t.r=='loss'),p=t=>+t.pnl||0,g=w.reduce((a,t)=>a+p(t),0),ls=Math.abs(x.reduce((a,t)=>a+p(t),0)),rs=re.filter(t=>t.rm!==''&&t.rm!=null),asc=[...re].reverse();let cu=0,bs=0,ws=0,cl=0;asc.forEach(t=>{if(t.r=='win'){cu++;cl=0}else if(t.r=='loss'){cl++;cu=0}else{cu=0;cl=0}bs=Math.max(bs,cu);ws=Math.max(ws,cl)});
return{n:l.length,w:w.length,l:x.length,wr:w.length+x.length?Math.round(100*w.length/(w.length+x.length)):0,net:re.reduce((a,t)=>a+p(t),0),pf:ls?(g/ls).toFixed(2):'-',ar:rs.length?(rs.reduce((a,t)=>a+ +t.rm,0)/rs.length).toFixed(2):'-',bs,ws,
saved:l.filter(t=>t.r=='al').reduce((a,t)=>a+Math.abs(p(t)),0),missed:l.filter(t=>t.r=='aw').reduce((a,t)=>a+Math.abs(p(t)),0)}}
const col=n=>n>0?'#34d399':n<0?'#f87171':'#fff';
function eq(l){const re=l.filter(t=>REAL.includes(t.r)).reverse();if(re.length<2)return'<div class="sm">Add 2+ trades to see the curve</div>';let c=0;const pts=re.map(t=>c+=+t.pnl||0),mn=Math.min(0,...pts),mx=Math.max(0.01,...pts);
return`<svg viewBox="0 0 300 90" width="100%"><polyline fill="none" stroke="#a78bfa" stroke-width="2.5" points="${pts.map((v,i)=>(i*300/(pts.length-1)).toFixed(1)+','+(85-(v-mn)/(mx-mn||1)*80).toFixed(1)).join(' ')}"/></svg>`}
const stats=s=>`<div class="g"><div class="card"><div class="sm">Net P&amp;L</div><div class="big" style="color:${col(s.net)}">${s.net.toFixed(2)}</div></div><div class="card"><div class="sm">Win rate</div><div class="big">${s.wr}%</div></div><div class="card"><div class="sm">Profit factor</div><div class="big">${s.pf}</div></div><div class="card"><div class="sm">Avg R</div><div class="big">${s.ar}</div></div></div>`;
const mnav=()=>`<div class="row"><button class="chip" onclick="mv(-1)">‹</button><b>${M.toLocaleString('en',{month:'long',year:'numeric'})}</b><button class="chip" onclick="mv(1)">›</button></div>`;
const mv=d=>{M=new Date(M.getFullYear(),M.getMonth()+d,1);render()};
const item=t=>`<div class="card" onclick="view(${t.id})"><div class="row"><span><span class="dot" style="background:${RS[t.r][1]}"></span><b>${esc(t.name||t.inst||'Trade')}</b></span><span style="color:${RS[t.r][1]}">${RS[t.r][0]}</span></div><div class="sm">${t.date} ${t.time||''} · ${esc(t.inst)} ${t.dir||''} · ${t.pnl!==''&&t.pnl!=null?t.pnl:''}</div></div>`;
function by(k){const m={};mt().forEach(t=>(t[k]||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(g=>(m[g]=m[g]||[]).push(t)));return Object.entries(m).map(([g,l])=>{const s=S(l);return`<div class="row"><span>${esc(g)} <span class="sm">${s.n} trades · ${s.wr}%</span></span><b style="color:${col(s.net)}">${s.net.toFixed(2)}</b></div>`}).join('')||'<div class="sm">No data yet</div>'}
function render(){let h='';
if(tab=='home'){const s=S(mt());h=`<h1>Good day, Jay</h1>${mnav()}${stats(s)}<div class="card"><div class="sm">Equity curve</div>${eq(mt())}</div><div class="g"><div class="card"><div class="sm">Win streak (best)</div><div class="big">${s.bs}</div></div><div class="card"><div class="sm">Loss streak (worst)</div><div class="big">${s.ws}</div></div></div><h2>Recent trades</h2>${T.slice(0,5).map(item).join('')||'<div class="card sm">No trades yet. Tap + to log your first one.</div>'}`}
if(tab=='cal'){const y=M.getFullYear(),mo=M.getMonth(),f=new Date(y,mo,1).getDay(),dm=new Date(y,mo+1,0).getDate();let c='';for(let i=0;i<f;i++)c+='<span></span>';
for(let d=1;d<=dm;d++){const ds=ym()+'-'+String(d).padStart(2,'0'),l=T.filter(t=>t.date==ds);let bg='';if(l.length){const re=l.filter(t=>REAL.includes(t.r)),n=re.reduce((a,t)=>a+(+t.pnl||0),0);bg=re.length?(n>0?RS.win[1]:n<0?RS.loss[1]:RS.be[1]):RS[l[0].r][1]}
c+=`<div style="${bg?`background:${bg};color:#111;font-weight:700`:''}" onclick="${l.length?`FD='${ds}';tab='list';render()`:''}">${d}</div>`}
const s=S(mt());h=`<h1>Calendar</h1>${mnav()}<div class="cal" style="margin:12px 0">${c}</div><div class="card">${Object.values(RS).map(r=>`<span class="sm" style="margin-right:10px"><span class="dot" style="background:${r[1]}"></span>${r[0]}</span>`).join('')}</div>${stats(s)}`}
if(tab=='list'){let l=T.filter(t=>(F=='all'||t.r==F)&&(!FD||t.date==FD));h=`<h1>Journal</h1>${FD?`<button class="chip on" onclick="FD=null;render()">${FD} ✕</button>`:''}<div>${['all',...Object.keys(RS)].map(k=>`<button class="chip ${F==k?'on':''}" onclick="F='${k}';render()">${k=='all'?'All':RS[k][0]}</button>`).join('')}</div>${l.map(item).join('')||'<div class="card sm">Nothing here.</div>'}`}
if(tab=='stats'){const s=S(mt());h=`<h1>Analytics</h1>${mnav()}${stats(s)}<div class="g"><div class="card"><div class="sm">Win / Loss</div><div class="big">${s.w} / ${s.l}</div></div><div class="card"><div class="sm">Trades</div><div class="big">${s.n}</div></div><div class="card"><div class="sm">Loss avoided</div><div class="big" style="color:${RS.al[1]}">${s.saved.toFixed(2)}</div></div><div class="card"><div class="sm">Win missed</div><div class="big" style="color:${RS.aw[1]}">${s.missed.toFixed(2)}</div></div></div><div class="card"><div class="sm">Equity curve</div>${eq(mt())}</div><h2>By setup</h2><div class="card">${by('setup')}</div><h2>By mistake</h2><div class="card">${by('mistake')}</div><h2>By psychology</h2><div class="card">${by('mind')}</div><h2>By session</h2><div class="card">${by('sess')}</div>`}
if(tab=='more'){h=`<h1>Backup</h1><div class="card"><p class="sm">Everything is stored only on this phone. Export regularly and keep the backup safe.</p><button class="btn" onclick="exp()">Export backup</button><label>Backup text appears here, copy and save it somewhere safe</label><textarea id="bk" style="min-height:120px"></textarea><button class="btn o" onclick="imp()">Import from the box above</button><label>Or pick a backup file</label><input type="file" id="bf" accept=".json,.txt" onchange="impf(this)"></div>`}
A.innerHTML=h+`<nav>${[['home','Home'],['cal','Calendar'],['+'],['list','Journal'],['stats','Stats'],['more','Backup']].map(([k,n])=>k=='+'?`<button class="plus" onclick="form()">+</button>`:`<button class="${tab==k?'on':''}" onclick="tab='${k}';FD=null;render()">${n}</button>`).join('')}</nav>`}
let cur;
function view(id){const t=T.find(x=>x.id==id),f=(k,v)=>v?`<h2>${k}</h2><div class="card">${esc(v).replace(/\n/g,'<br>')}</div>`:'';
ov(`<h1>${esc(t.name||t.inst)}</h1><div class="card"><b style="color:${RS[t.r][1]}">${RS[t.r][0]}</b> · P&amp;L ${t.pnl||'-'} · ${t.rm?t.rm+'R':''}<div class="sm">${t.date} ${t.time||''} · ${esc(t.inst)} ${t.dir||''} · ${esc(t.sess)} · Quality ${t.star||'-'}/5</div><div class="sm">${esc([t.setup,t.mistake,t.mind].filter(Boolean).join(' · '))}</div></div><div class="imgs">${(t.imgs||[]).map(i=>`<img src="${i}">`).join('')}</div>${f('Why I took this trade',t.why)}${f('Negative things',t.neg)}${f('What went wrong',t.wrong)}${f('What I did right',t.right)}${f('Lesson',t.lesson)}<button class="btn" onclick="form(${t.id})">Edit</button><button class="btn o" onclick="rm(${t.id})">Delete</button><button class="btn o" onclick="cl()">Close</button>`)}
const ov=h=>{let o=document.getElementById('ov');if(!o){o=document.createElement('div');o.id='ov';o.className='ov';document.body.appendChild(o)}o.innerHTML=h;o.scrollTop=0},cl=()=>{const o=document.getElementById('ov');o&&o.remove();render()};
const rm=async id=>{if(confirm('Delete this trade?')){await q('readwrite',s=>s.delete(id));await load();cl()}};
function form(id){const t=id?T.find(x=>x.id==id):{r:'win',date:new Date().toISOString().slice(0,10),time:new Date().toTimeString().slice(0,5),dir:'Long',imgs:[],star:3};cur={...t,imgs:[...(t.imgs||[])]};
const i=(k,l,ty='text')=>`<label>${l}</label><input id="f_${k}" type="${ty}" value="${esc(cur[k])}">`,ta=(k,l)=>`<label>${l}</label><textarea id="f_${k}">${esc(cur[k])}</textarea>`;
ov(`<h1>${id?'Edit trade':'New trade'}</h1>${i('name','Trade name')}<div class="g">${i('date','Date','date')}${i('time','Time','time')}</div><div class="g">${i('inst','Instrument')}<div><label>Direction</label><select id="f_dir"><option>Long<option ${cur.dir=='Short'?'selected':''}>Short</select></div></div>${i('sess','Session (Asian / London / NY)')}<label>Result</label><div id="rb">${Object.entries(RS).map(([k,v])=>`<button class="chip ${cur.r==k?'on':''}" style="${cur.r==k?`background:${v[1]};color:#111`:''}" onclick="cur.r='${k}';rr()">${v[0]}</button>`).join('')}</div><div class="g">${i('pnl','P&L (avoided: amount it would have been)','number')}${i('rm','R multiple','number')}</div><div class="g">${i('entry','Entry','number')}${i('sl','Stop loss','number')}${i('tp','Take profit','number')}${i('exit','Exit','number')}</div>${i('setup','Setup tags (comma separated)')}${i('mistake','Mistake tags')}${i('mind','Psychology tags (Calm, FOMO, Fear...)')}<label>Trade quality 1-5</label><select id="f_star">${[1,2,3,4,5].map(n=>`<option ${cur.star==n?'selected':''}>${n}`).join('')}</select>${ta('why','Why did I take this trade?')}${ta('neg','Negative things for this trade')}${ta('wrong','What went wrong?')}${ta('right','What did I do right?')}${ta('lesson','Lesson / what will I do differently?')}<label>Screenshots</label><input type="file" accept="image/*" multiple onchange="pics(this)"><div class="imgs" id="pv">${cur.imgs.map(i=>`<img src="${i}">`).join('')}</div><button class="btn" onclick="sv(${id||0})">Save trade</button><button class="btn o" onclick="cl()">Cancel</button>`)}
const rr=()=>{document.querySelectorAll('#rb button').forEach((b,i)=>{const k=Object.keys(RS)[i],on=cur.r==k;b.className='chip'+(on?' on':'');b.style.cssText=on?`background:${RS[k][1]};color:#111`:''})};
function pics(el){[...el.files].forEach(f=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.7);cur.imgs.push(d);document.getElementById('pv').insertAdjacentHTML('beforeend',`<img src="${d}">`)};im.src=r.result};r.readAsDataURL(f)})}
async function sv(id){['name','date','time','inst','dir','sess','pnl','rm','entry','sl','tp','exit','setup','mistake','mind','star','why','neg','wrong','right','lesson'].forEach(k=>cur[k]=document.getElementById('f_'+k).value);cur.id=id||Date.now();await q('readwrite',s=>s.put(cur));await load();cl()}
function exp(){document.getElementById('bk').value=JSON.stringify(T);document.getElementById('bk').select();try{navigator.clipboard.writeText(document.getElementById('bk').value)}catch(e){}alert('Backup ready in the box (copied if allowed). Save it in notes or send it to yourself.')}
async function imp(){try{await put(JSON.parse(document.getElementById('bk').value))}catch(e){alert('Invalid backup text')}}
function impf(el){const r=new FileReader();r.onload=async()=>{try{await put(JSON.parse(r.result))}catch(e){alert('Invalid backup file')}};r.readAsText(el.files[0])}
async function put(a){for(const t of a)await q('readwrite',s=>s.put(t));await load();alert(a.length+' trades restored');render()}
const rq=indexedDB.open('ej',1);rq.onupgradeneeded=e=>e.target.result.createObjectStore('t',{keyPath:'id'});rq.onsuccess=async e=>{db=e.target.result;await load();render()};
</script></body></html>
